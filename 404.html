    <!-- O GitHub Pages mostra esta página em QUALQUER endereço que não existe, em qualquer profundidade.
         O <base> abaixo faz CSS e links carregarem sempre do lugar certo: na prévia (github.io/nome-do-repositório/)
         e no domínio próprio (raiz). -->
    <script>
        (function () {
            var base = "/";
            if (/\.github\.io$/.test(location.hostname)) base = "/" + (location.pathname.split("/")[1] || "") + "/";
            document.write('<base href="' + base + '">');
        })();
    </script>
    <title>Página não encontrada | Júlia Gabriely, Fisioterapeuta</title>
